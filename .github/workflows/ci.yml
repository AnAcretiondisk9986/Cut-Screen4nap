name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CutScreen.csproj

      - name: Build
        run: dotnet build CutScreen.csproj -c Release --no-restore

      - name: Self-test
        run: dotnet run --project CutScreen.csproj -c Release -p:DefineConstants=SELFTEST -p:OutputType=Exe
